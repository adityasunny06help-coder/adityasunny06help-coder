<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    .bg { fill: #0d1117; stroke: #8A2BE2; stroke-width: 1.5; }
    .bar { fill: #161b22; }
    .txt { font-family: 'Courier New', monospace; font-size: 15px; fill: #c9d1d9; }
    .cmd { fill: #ffffff; font-weight: bold; }
    .ok { fill: #3fb950; }
    .hl { fill: #bc8cff; }
    .dim { fill: #8b949e; }
  </style>
  <rect class="bg" x="1" y="1" width="758" height="298" rx="10"/>
  <rect class="bar" x="1" y="1" width="758" height="34" rx="10"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" class="txt dim" font-size="13">aditay@hunter: ~/bug-bounty</text>
  <g opacity="0">
    <text x="24" y="66" class="txt cmd">$ whoami</text>
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="92" class="txt hl">aditay_kumar — bug bounty hunter &amp; security researcher</text>
    <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="126" class="txt cmd">$ ./hunt --scope web,api,android --verify-first</text>
    <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="152" class="txt ok">[+] $10,000 in bounties — HackerOne · Bugcrowd · YesWeHack · Intigriti · Meta</text>
    <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="178" class="txt ok">[+] Hall of Fame — Meta · Dell · Verisk · Xfinity Home · Pine Labs</text>
    <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="204" class="txt ok">[+] 13 reports @ Microsoft MSRC · OpenVMM fix merged</text>
    <animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="238" class="txt cmd">$ status</text>
    <animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.2s" fill="freeze"/>
  </g>
  <g opacity="0">
    <text x="24" y="264" class="txt hl">open to cybersecurity internships &amp; research collabs</text>
    <animate attributeName="opacity" values="0;1" begin="5.4s" dur="0.2s" fill="freeze"/>
  </g>
  <rect x="24" y="272" width="9" height="16" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
